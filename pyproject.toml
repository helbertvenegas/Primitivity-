[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "double-ore-14641-pi-verification"
version = "0.3.0"
description = "Exact matrix and noncommutative verification for double Ore extensions of type (14641)"
requires-python = ">=3.10"
dependencies = ["sympy==1.14.0"]
readme = "README.md"
authors = [{name = "James Gómez"}, {name = "Helbert Venegas"}]

[tool.setuptools.packages.find]
include = ["ore14641*"]
